version: '3.8'
services:
  mongo:
    image: mongo:6.0
    container_name: bhaago-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: bhaago
    ports:
      - "27017:27017"

  mongo-express:
    image: mongo-express:1.0.0
    container_name: bhaago-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "false"
    ports:
      - "8081:8081"
    depends_on:
      - mongo

volumes:
  mongo-data: